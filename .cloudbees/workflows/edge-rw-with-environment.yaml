apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: edge rw with environment
on:
  workflow_dispatch:
jobs:
  simple-check:
    environment: mlcbedgerunnersenv
    steps:
      - run: echo "vars. varslabel-> ${{ vars.varslabel }}"
        uses: docker://golang:1.20.3-alpine3.17
        shell: sh
  caller-job-env:
    environment: mlcbedgerunnersenv
    uses: ./.cloudbees/workflows/reusable-edge.yaml
    with:
      runner_label: ${{ vars.envlabel }}
    needs:
      - simple-check
  
  

